version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncraft
      POSTGRES_PASSWORD: syncraft_password
      POSTGRES_DB: syncraft_db
    ports:
      - "5432:5432"
    volumes:
      - syncraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncraft -d syncraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  syncraft_pgdata:
